# GalaxyCut — checagem rápida em cada push/PR: tipos, lint e build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tipos (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build estático
        run: npm run build
      - name: higiene
        run: |
          if grep -rEn "sk-or-v1-[A-Za-z0-9]{10}|ghp_[A-Za-z0-9]{10}|vcp_[A-Za-z0-9]{10}" src/ api/ desktop/; then echo "segredo exposto"; exit 1; fi
          grep -q "Archivo" src/app/layout.tsx
          test -f LICENSE

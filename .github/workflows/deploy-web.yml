# GalaxyCut — publica o site no GitHub Pages a cada push na main.
# URL final: https://lucasgabrieldevgg.github.io/galaxycut/
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Build estático (com basePath do Pages)
        env:
          BASE_PATH: /galaxycut
          NEXT_PUBLIC_BASE_PATH: /galaxycut
        run: npm run build

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no Pages
        id: deployment
        uses: actions/deploy-pages@v4
